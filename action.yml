name: Publish documentation with GraphArch
description: Build documentation with a verified release or exact GraphArch source revision
inputs:
  version:
    description: Exact published version, without a leading v
    required: false
  expected-revision:
    description: Optional exact release source commit to verify against published provenance
    required: false
  source-revision:
    description: Exact Git SHA of this action checkout, mutually exclusive with version (Linux source build)
    required: false
  mode:
    description: build-family (default) or install for setup only
    default: build-family
  source:
    description: Source directory containing the ontology family
    default: .
  source-kind:
    description: directory or checkout (for local Git repository provenance)
    default: directory
  definitions:
    description: Optional external publication definitions (supply with project and target)
  project:
    description: Optional project IRI for external definitions
  target:
    description: Optional target IRI for external definitions
  output:
    description: Output root directory
    default: build/docs
  cache:
    description: Cache verified release binaries
    default: 'true'
outputs:
  version:
    value: ${{ steps.install.outputs.version || steps.source-install.outputs.version }}
  revision:
    value: ${{ steps.install.outputs.revision || steps.source-install.outputs.revision }}
  binary-path:
    value: ${{ steps.install.outputs.binary-path || steps.source-install.outputs.binary-path }}
  publication-path:
    value: ${{ steps.build.outputs.publication-path }}
  pdf-path:
    value: ${{ steps.build.outputs.pdf-path }}
  kg-path:
    value: ${{ steps.build.outputs.kg-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Validate generator selection
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ inputs.version }}
        GRAPHARCH_SOURCE_REVISION: ${{ inputs.source-revision }}
      run: python "$GITHUB_ACTION_PATH/packaging/source_action.py" validate
    - name: Validate publication inputs
      shell: bash
      env:
        GRAPHARCH_MODE: ${{ inputs.mode }}
        GRAPHARCH_SOURCE: ${{ inputs.source }}
        GRAPHARCH_SOURCE_KIND: ${{ inputs.source-kind }}
        GRAPHARCH_DEFINITIONS: ${{ inputs.definitions }}
        GRAPHARCH_PROJECT: ${{ inputs.project }}
        GRAPHARCH_TARGET: ${{ inputs.target }}
        GRAPHARCH_OUTPUT: ${{ inputs.output }}
      run: python "$GITHUB_ACTION_PATH/packaging/build_action.py" validate
    - id: platform
      if: inputs.version != ''
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ inputs.version }}
      run: python "$GITHUB_ACTION_PATH/packaging/setup_action.py" identify
    - uses: actions/cache@v6
      if: inputs.version != '' && inputs.cache == 'true'
      with:
        path: ${{ runner.tool_cache }}/grapharch/${{ inputs.version }}/${{ steps.platform.outputs.target }}
        key: grapharch-release-${{ inputs.version }}-${{ steps.platform.outputs.target }}-v1
    - id: install
      if: inputs.version != ''
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ inputs.version }}
        GRAPHARCH_EXPECTED_REVISION: ${{ inputs.expected-revision }}
      run: python "$GITHUB_ACTION_PATH/packaging/setup_action.py" install
    - id: source-install
      if: inputs.source-revision != ''
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ inputs.version }}
        GRAPHARCH_SOURCE_REVISION: ${{ inputs.source-revision }}
      run: python "$GITHUB_ACTION_PATH/packaging/source_action.py" install
    - id: build
      shell: bash
      env:
        GRAPHARCH_MODE: ${{ inputs.mode }}
        GRAPHARCH_BINARY: ${{ steps.install.outputs.binary-path || steps.source-install.outputs.binary-path }}
        GRAPHARCH_SOURCE: ${{ inputs.source }}
        GRAPHARCH_SOURCE_KIND: ${{ inputs.source-kind }}
        GRAPHARCH_DEFINITIONS: ${{ inputs.definitions }}
        GRAPHARCH_PROJECT: ${{ inputs.project }}
        GRAPHARCH_TARGET: ${{ inputs.target }}
        GRAPHARCH_OUTPUT: ${{ inputs.output }}
      run: python "$GITHUB_ACTION_PATH/packaging/build_action.py"
