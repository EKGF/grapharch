name: Publish documentation with GraphArch
description: Build documentation with the verified GraphArch release of this action commit
inputs:
  version:
    description: Exact published version without a leading v, supplied with expected-revision; omit both to install the release of this action commit
    required: false
  expected-revision:
    description: Exact release commit SHA of version, verified against published provenance
    required: false
  source-revision:
    description: Exact Git SHA of a local action checkout to build from source instead (Linux); excludes version
    required: false
  mode:
    description: build-family (default) or install for setup only
    default: build-family
  source:
    description: Source directory containing the ontology family
    default: .
  source-kind:
    description: directory or checkout (for local Git repository provenance)
    default: directory
  definitions:
    description: Optional external publication definitions (supply with project and target)
  project:
    description: Optional project IRI for external definitions
  target:
    description: Optional target IRI for external definitions
  output:
    description: Output root directory
    default: build/docs
  cache:
    description: Cache verified release binaries
    default: 'true'
outputs:
  version:
    value: ${{ steps.install.outputs.version || steps.source-install.outputs.version }}
  revision:
    value: ${{ steps.install.outputs.revision || steps.source-install.outputs.revision }}
  binary-path:
    value: ${{ steps.install.outputs.binary-path || steps.source-install.outputs.binary-path }}
  publication-path:
    value: ${{ steps.build.outputs.publication-path }}
  pdf-path:
    value: ${{ steps.build.outputs.pdf-path }}
  kg-path:
    value: ${{ steps.build.outputs.kg-path }}
runs:
  using: composite
  steps:
    # Composite run steps see the action's own ref only through env
    # (actions/runner#2473). Capture it before any nested action runs.
    - id: identity
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if printf 'repository=%s\nref=%s\n' "$ACTION_REPOSITORY" "$ACTION_REF" >> "$GITHUB_OUTPUT"; then :; else
          printf 'GraphArch selection: cannot record the action reference\n' >&2
          exit 1
        fi
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - id: select
      name: Select the generator
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ inputs.version }}
        GRAPHARCH_EXPECTED_REVISION: ${{ inputs.expected-revision }}
        GRAPHARCH_SOURCE_REVISION: ${{ inputs.source-revision }}
        GRAPHARCH_ACTION_REPOSITORY: ${{ steps.identity.outputs.repository }}
        GRAPHARCH_ACTION_REF: ${{ steps.identity.outputs.ref }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/action_selection.py"
    - name: Validate publication inputs
      shell: bash
      env:
        GRAPHARCH_MODE: ${{ inputs.mode }}
        GRAPHARCH_SOURCE: ${{ inputs.source }}
        GRAPHARCH_SOURCE_KIND: ${{ inputs.source-kind }}
        GRAPHARCH_DEFINITIONS: ${{ inputs.definitions }}
        GRAPHARCH_PROJECT: ${{ inputs.project }}
        GRAPHARCH_TARGET: ${{ inputs.target }}
        GRAPHARCH_OUTPUT: ${{ inputs.output }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/build_action.py" validate
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up local UML renderer
      shell: bash
      run: python -B "$GITHUB_ACTION_PATH/packaging/setup_plantuml.py"
    - id: platform
      if: steps.select.outputs.kind == 'release'
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ steps.select.outputs.version }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/setup_action.py" identify
    - uses: actions/cache@v6
      if: steps.select.outputs.kind == 'release' && inputs.cache == 'true'
      with:
        path: ${{ runner.tool_cache }}/grapharch/${{ steps.select.outputs.version }}/${{ steps.platform.outputs.target }}
        key: grapharch-release-${{ steps.select.outputs.version }}-${{ steps.platform.outputs.target }}-v1
    - id: install
      if: steps.select.outputs.kind == 'release'
      shell: bash
      env:
        GRAPHARCH_VERSION: ${{ steps.select.outputs.version }}
        GRAPHARCH_EXPECTED_REVISION: ${{ steps.select.outputs.revision }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/setup_action.py" install
    - id: source-install
      if: steps.select.outputs.kind == 'source'
      shell: bash
      env:
        GRAPHARCH_SOURCE_REVISION: ${{ steps.select.outputs.revision }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/source_action.py" install
    - id: build
      shell: bash
      env:
        GRAPHARCH_MODE: ${{ inputs.mode }}
        GRAPHARCH_BINARY: ${{ steps.install.outputs.binary-path || steps.source-install.outputs.binary-path }}
        GRAPHARCH_SOURCE: ${{ inputs.source }}
        GRAPHARCH_SOURCE_KIND: ${{ inputs.source-kind }}
        GRAPHARCH_DEFINITIONS: ${{ inputs.definitions }}
        GRAPHARCH_PROJECT: ${{ inputs.project }}
        GRAPHARCH_TARGET: ${{ inputs.target }}
        GRAPHARCH_OUTPUT: ${{ inputs.output }}
      run: python -B "$GITHUB_ACTION_PATH/packaging/build_action.py"
