name: Set up the candidate archive transport
description: Install the pinned prebuilt nextest executable without a source-build fallback
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
      with:
        tool: cargo-nextest@0.9.151
        checksum: 'true'
        fallback: none
