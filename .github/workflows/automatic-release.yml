name: Automatic release
run-name: ${{ github.event_name == 'workflow_run' && 'Prepare GraphArch release' || (inputs.publish-run != '' && 'Publish verified GraphArch artifacts' || 'Build and publish GraphArch release') }}
on:
  workflow_run:
    workflows: ['Rust CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verified-run:
        description: Successful full main-push Rust CI run to release
        required: true
        type: string
      publish-run:
        description: Reuse a verified assembled distribution from this release producer run
        type: string
        default: ''
      bump:
        description: Patch by default; minor only when explicitly selected
        type: choice
        options: [patch, minor]
        default: patch
permissions:
  contents: read
concurrency:
  group: grapharch-automatic-release-${{ github.event_name == 'workflow_run' && 'build' || 'publish' }}
  cancel-in-progress: false
jobs:
  reserve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.reserve.outputs.ready }}
      revision: ${{ steps.reserve.outputs.revision }}
      source: ${{ steps.reserve.outputs.source }}
      run: ${{ steps.reserve.outputs.run }}
      version: ${{ steps.reserve.outputs.version }}
    steps:
      # Execute only trusted main automation, never a triggering PR checkout.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified-run || github.event.workflow_run.id }}
          RELEASE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: python3 -B packaging/auto_release.py prepare --run "$VERIFIED_RUN" --bump "$RELEASE_BUMP"
  distribute:
    needs: reserve
    if: needs.reserve.outputs.ready == 'true'
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/distribute.yml
    with:
      publish: true
      publish-packages: ${{ github.event_name == 'workflow_dispatch' }}
      artifact-run: ${{ inputs.publish-run }}
      revision: ${{ needs.reserve.outputs.revision }}
      verified-source: ${{ needs.reserve.outputs.source }}
      verified-run: ${{ needs.reserve.outputs.run }}
    secrets: inherit
  dispatch-publication:
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && needs.reserve.result == 'success' && needs.distribute.result == 'success' && needs.reserve.outputs.ready == 'true' }}
    needs: [reserve, distribute]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish the verified artifacts through a registry-supported event
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ needs.reserve.outputs.run }}
        run: gh workflow run automatic-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "verified-run=$VERIFIED_RUN" -f "publish-run=$GITHUB_RUN_ID"
  action-refs:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.reserve.result == 'success' && needs.distribute.result == 'success' }}
    needs: [reserve, distribute]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.reserve.outputs.revision }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-automation
      - name: Upgrade maintained Action references only after every channel succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
        run: python3 -B "$GITHUB_WORKSPACE/release-automation/packaging/action_refs.py" --version "$RELEASE_VERSION"
