name: SPARQL integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    uses: ./.github/workflows/rust-ci.yml
    # Capability ceiling required by the reusable workflow declaration. Its
    # sparql scope never deploys, and every executable consumer is read-only.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      scope: sparql
