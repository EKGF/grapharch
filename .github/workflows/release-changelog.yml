name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this validated Cargo.toml version as a GitHub release
        type: boolean
        required: true
        default: false
      publish-packages:
        description: Publish registries and update Homebrew
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  distribute:
    uses: ./.github/workflows/distribute.yml
    with:
      publish: ${{ inputs.publish }}
      publish-packages: ${{ inputs.publish-packages }}
    secrets: inherit
