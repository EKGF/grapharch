name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this validated Cargo.toml version as a GitHub release
        type: boolean
        required: true
        default: false
      publish-packages:
        description: Publish Python, npm and crates.io packages
        type: boolean
        default: false
      publish-homebrew:
        description: Update the separately owned Homebrew tap
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  distribute:
    uses: ./.github/workflows/distribute.yml
    with:
      publish: ${{ inputs.publish }}
      publish-packages: ${{ inputs.publish-packages }}
      publish-homebrew: ${{ inputs.publish-homebrew }}
    secrets: inherit
