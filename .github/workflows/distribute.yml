name: Build and distribute
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated version to release channels
        required: true
        type: boolean
        default: false
      publish-homebrew:
        description: Update the separately owned Homebrew tap
        type: boolean
        default: false
      publish-packages:
        description: Publish Python, npm and crates.io packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      artifact-run:
        type: string
        default: ''
      verified-source:
        type: string
        default: ''
      verified-run:
        type: string
        default: ''
      publish:
        required: false
        type: boolean
        default: false
      publish-homebrew:
        type: boolean
        default: false
      publish-packages:
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
env:
  GRAPHARCH_VERIFIED_SOURCE: ${{ inputs.verified-source }}
  GRAPHARCH_VERIFIED_RUN: ${{ inputs.verified-run }}
concurrency:
  group: distribution-${{ inputs.revision || github.sha }}-${{ inputs.artifact-run != '' && 'publish' || 'build' }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require a registry-supported publication event
        if: inputs.publish-packages == true
        run: |
          python3 - <<'PY'
          import os
          if os.environ['GITHUB_EVENT_NAME'] not in ('push', 'release', 'workflow_dispatch'):
              raise SystemExit('Registry publishing requires push, release or workflow_dispatch; workflow_run is not supported')
          PY
      - id: metadata
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: python packaging/release_metadata.py
      - run: python packaging/distribute.py check
      - run: python -m unittest discover -s packaging/tests
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test npm/tests/*.test.cjs
  verify-proof:
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Verify exact successful candidate and metadata-only release delta
        if: inputs.verified-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified-run }}
          VERIFIED_SOURCE: ${{ inputs.verified-source }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 -B packaging/auto_release.py verify --run "$VERIFIED_RUN" --source "$VERIFIED_SOURCE" --revision "$RELEASE_REVISION"
  verify-source:
    if: inputs.verified-run == ''
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-plantuml
      - name: Install native dependencies
        timeout-minutes: 5
        run: python3 packaging/install_build_dependencies.py
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: false
      - name: Bind the generator identity to this actual build
        shell: bash
        env:
          REVIEWED_REVISION: ${{ needs.metadata.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: python -B packaging/build_context.py --revision "$REVIEWED_REVISION"
      - run: cargo fmt --check
      - name: Verify portable TLS dependency graphs
        run: python packaging/check_release_dependencies.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
  binaries:
    needs: [metadata, verify-proof, verify-source]
    if: >-
      always() && inputs.artifact-run == '' && needs.metadata.result == 'success' && needs.verify-proof.result == 'success'
      && (needs.verify-source.result == 'success' || (needs.verify-source.result == 'skipped' && inputs.verified-run != ''))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GRAPHARCH_BUILD_REVISION: ${{ needs.metadata.outputs.revision }}
      GRAPHARCH_BUILD_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.os == 'win32' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Bind the generator identity to this actual build
        shell: bash
        env:
          REVIEWED_REVISION: ${{ needs.metadata.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: python -B packaging/build_context.py --revision "$REVIEWED_REVISION"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.cpu }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.cpu }}
      - name: Configure native runtime linking
        run: python packaging/link_environment.py --target ${{ matrix.target }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache-on-failure: false
      - name: Configure native Windows build environment
        if: matrix.os == 'win32'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cpu == 'arm64' && 'arm64' || 'x64' }}
      - name: Reserve the distribution directory on the host
        run: python packaging/prepare_platform.py --target ${{ matrix.target }} --output dist --initialize
      - name: Build the CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          docker-options: --env GRAPHARCH_BUILD_REVISION --env GRAPHARCH_BUILD_RELEASE_VERSION --env GRAPHARCH_BUILD_CONTEXT
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: nightly-2026-10-30
          args: --release --locked --bindings bin --strip --auditwheel check --out dist/wheels
          before-script-linux: |
            yum install -y clang-devel || { printf 'Cannot install libclang\n' >&2; exit 1; }
            /opt/python/cp312-cp312/bin/python packaging/link_environment.py --target ${{ matrix.target }} --shell-output /tmp/grapharch-link-environment.sh || { printf 'Cannot configure the static C++ runtime\n' >&2; exit 1; }
            . /tmp/grapharch-link-environment.sh || { printf 'Cannot load native runtime configuration\n' >&2; exit 1; }
      - name: Create standalone and npm artifacts from the wheel's executable
        run: python packaging/prepare_platform.py --target ${{ matrix.target }} --output dist
      - name: Audit standalone runtime dependencies
        run: python packaging/audit_binary.py --target ${{ matrix.target }} --binary dist/npm/cli-${{ matrix.key }}/bin/grapharch${{ matrix.os == 'win32' && '.exe' || '' }}
      - name: Build main npm package for install smoke test
        run: python packaging/distribute.py build-main --output dist
      - name: Pack main npm package
        run: python packaging/distribute.py pack-npm --output dist
      - name: Verify offline installs on the native runner
        run: python packaging/smoke.py --target ${{ matrix.target }} --output dist
      - name: Remove smoke-only main package before aggregation
        run: python packaging/prepare_platform.py --target ${{ matrix.target }} --output dist --clean-main
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  verify-artifacts:
    if: inputs.artifact-run != ''
    runs-on: ubuntu-latest
    needs: [metadata, verify-proof]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Verify the original six native builds and retained assembly
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
          VERIFIED_SOURCE: ${{ inputs.verified-source }}
          VERIFIED_RUN: ${{ inputs.verified-run }}
        run: python3 -B packaging/artifact_proof.py --run "$ARTIFACT_RUN" --source "$VERIFIED_SOURCE" --verified-run "$VERIFIED_RUN"
  assemble:
    runs-on: ubuntu-latest
    needs: [metadata, binaries, verify-proof, verify-artifacts]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.verify-proof.result == 'success' && ((inputs.artifact-run == '' && needs.binaries.result == 'success') || (inputs.artifact-run != '' && needs.verify-artifacts.result == 'success')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        if: inputs.artifact-run == ''
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: inputs.artifact-run != ''
        with:
          name: release-distribution
          path: dist
          run-id: ${{ inputs.artifact-run }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v7
        if: inputs.artifact-run != ''
        with:
          ref: ${{ github.workflow_sha }}
          path: release-automation
      - name: Verify reused manifest source and version before publishing
        if: inputs.artifact-run != ''
        env:
          RELEASE_REVISION: ${{ needs.metadata.outputs.revision }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 -B "$GITHUB_WORKSPACE/release-automation/packaging/artifact_proof.py" --directory dist --revision "$RELEASE_REVISION" --version "$RELEASE_VERSION"
      - run: python packaging/distribute.py build-main --output dist
        if: inputs.artifact-run == ''
      - run: python packaging/distribute.py pack-npm --output dist
        if: inputs.artifact-run == ''
      - run: python packaging/distribute.py verify-release --output dist
      - run: python packaging/distribute.py homebrew --output dist --destination dist/homebrew/grapharch.rb
        if: inputs.artifact-run == ''
      - run: ruby -c dist/homebrew/grapharch.rb
      - uses: actions/upload-artifact@v7
        if: inputs.artifact-run == ''
        with:
          name: release-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30
  github-release:
    needs: [metadata, assemble]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.assemble.result == 'success' && needs.metadata.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
          run-id: ${{ inputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v7
        if: inputs.artifact-run != ''
        with:
          ref: ${{ github.workflow_sha }}
          path: release-automation
      - name: Require unchanged original GitHub publication for artifact-only handoff
        if: inputs.artifact-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 -B "$GITHUB_WORKSPACE/release-automation/packaging/release_assets.py" --version "$RELEASE_VERSION" --output dist --require-complete
      - name: Preserve immutable already-published artifact bytes
        if: inputs.artifact-run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 -B packaging/release_assets.py --version "$RELEASE_VERSION" --output dist
      - uses: softprops/action-gh-release@v3
        if: inputs.artifact-run == ''
        with:
          overwrite_files: false
          tag_name: v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ needs.metadata.outputs.revision }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.json
            dist/homebrew/grapharch.rb
  publish-pypi:
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.github-release.result == 'success' && inputs.publish-packages == true }}
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
          run-id: ${{ inputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Reject conflicting already-published wheels before resuming
        run: python3 -B packaging/registry_state.py --output dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true
  publish-npm:
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.github-release.result == 'success' && inputs.publish-packages == true }}
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
          run-id: ${{ inputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - run: python packaging/publish_npm.py --output "$GITHUB_WORKSPACE/dist"
  publish-crate:
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.github-release.result == 'success' && inputs.publish-packages == true }}
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: python3 -B packaging/publish_crate.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  publish-homebrew:
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.github-release.result == 'success' && inputs.publish-homebrew == true }}
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
          run-id: ${{ inputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { printf 'HOMEBREW_TAP_TOKEN is required\n' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the existing Legra tap
        working-directory: tap
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp ../dist/homebrew/grapharch.rb Formula/grapharch.rb || exit $?
          git config user.name 'github-actions[bot]' || exit $?
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' || exit $?
          if git diff --quiet -- Formula/grapharch.rb && git ls-files --error-unmatch Formula/grapharch.rb >/dev/null 2>&1; then
            printf 'Formula already matches this validated release\n'
          else
            git add Formula/grapharch.rb || exit $?
            git commit -m "feat: release GraphArch $RELEASE_VERSION" || exit $?
            git push origin HEAD || exit $?
          fi
