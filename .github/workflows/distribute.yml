name: Build and distribute
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated version to release channels
        required: true
        type: boolean
        default: false
      publish-packages:
        description: Publish registry packages and update the Homebrew tap
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
      publish-packages:
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: metadata
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: python packaging/release_metadata.py
      - run: python packaging/distribute.py check
      - run: python -m unittest discover -s packaging/tests
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test npm/tests/*.test.cjs
  verify-source:
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        timeout-minutes: 5
        run: python3 packaging/install_build_dependencies.py
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --check
      - name: Verify portable TLS dependency graphs
        run: python packaging/check_release_dependencies.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
  binaries:
    needs: [metadata, verify-source]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTFLAGS: ${{ matrix.os == 'win32' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.cpu }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.cpu }}
      - name: Configure native runtime linking
        run: python packaging/link_environment.py --target ${{ matrix.target }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Configure native Windows build environment
        if: matrix.os == 'win32'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cpu == 'arm64' && 'arm64' || 'x64' }}
      - name: Build the CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: nightly
          args: --release --locked --bindings bin --strip --auditwheel check --out dist/wheels
          before-script-linux: yum install -y clang-devel || { printf 'Cannot install libclang\n' >&2; exit 1; }
      - name: Create standalone and npm artifacts from the wheel's executable
        run: python packaging/prepare_platform.py --target ${{ matrix.target }} --output dist
      - name: Audit standalone runtime dependencies
        run: python packaging/audit_binary.py --target ${{ matrix.target }} --binary dist/npm/cli-${{ matrix.key }}/bin/grapharch${{ matrix.os == 'win32' && '.exe' || '' }}
      - name: Build main npm package for install smoke test
        run: python packaging/distribute.py build-main --output dist
      - name: Pack main npm package
        run: python packaging/distribute.py pack-npm --output dist
      - name: Verify offline installs on the native runner
        run: python packaging/smoke.py --target ${{ matrix.target }} --output dist
      - name: Remove smoke-only main package before aggregation
        run: python packaging/prepare_platform.py --target ${{ matrix.target }} --output dist --clean-main
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  assemble:
    runs-on: ubuntu-latest
    needs: [metadata, binaries]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true
      - run: python packaging/distribute.py build-main --output dist
      - run: python packaging/distribute.py pack-npm --output dist
      - run: python packaging/distribute.py verify-release --output dist
      - run: python packaging/distribute.py homebrew --output dist --destination dist/homebrew/grapharch.rb
      - run: ruby -c dist/homebrew/grapharch.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30
  github-release:
    needs: [metadata, assemble]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.json
            dist/homebrew/grapharch.rb
  publish-pypi:
    if: inputs.publish-packages == true
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
  publish-npm:
    if: inputs.publish-packages == true
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
      - run: python packaging/publish_npm.py --output dist
  publish-crate:
    if: inputs.publish-packages == true
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked --package grapharch
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  publish-homebrew:
    if: inputs.publish-packages == true
    needs: [metadata, github-release]
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distribution
          path: dist
      - name: Require tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { printf 'HOMEBREW_TAP_TOKEN is required\n' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the existing Legra tap
        working-directory: tap
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp ../dist/homebrew/grapharch.rb Formula/grapharch.rb || exit $?
          git config user.name 'github-actions[bot]' || exit $?
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' || exit $?
          if git diff --quiet -- Formula/grapharch.rb && git ls-files --error-unmatch Formula/grapharch.rb >/dev/null 2>&1; then
            printf 'Formula already matches this validated release\n'
          else
            git add Formula/grapharch.rb || exit $?
            git commit -m "feat: release GraphArch $RELEASE_VERSION" || exit $?
            git push origin HEAD || exit $?
          fi
