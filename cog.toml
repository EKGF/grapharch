from_latest_tag = false
ignore_merge_commits = true
generate_mono_repository_global_tag = true
branch_whitelist = ["main", "release/**"]
tag_prefix = "v"

pre_bump_hooks = [
    "cargo set-version --workspace {{version}}",
    "python3 packaging/distribute.py sync-version",
    "cargo check --locked",
]
post_bump_hooks = []

[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
cog verify --file "$1" || exit $?
base="${GRAPHARCH_COMMIT_BASE:-refs/remotes/origin/main}"
if git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
    cog check "$base..HEAD" || exit $?
else
    printf 'Cannot resolve commit-check base %s; fetch it before committing.\n' "$base" >&2
    exit 1
fi
cargo +nightly fmt -v --all --check || exit $?
cargo +nightly clippy || exit $?
"""


[commit_types]
chore = { changelog_title = "Misc", omit_from_changelog = true }
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "EKGF"
repository = "GraphArch"
authors = [{ signature = "Jacobus Geluk", username = "jgeluk" }]
